name: Release (VOxee brand)

# Builds the branded, unsigned installers (Windows + Linux) and publishes them
# as a single public GitHub Release on this fork (Oxeegen/VOxee). Triggered by a
# `voxee-vX.Y.Z` tag (the tag is the source of truth: its name sets the release
# version), or manually via workflow_dispatch with an explicit version.
#
# Endpoint / model config is injected from repository Variables
# (Settings > Secrets and variables > Actions > Variables). API keys are never
# built in — they stay per-user at runtime.

on:
  push:
    tags:
      - "voxee-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.0 (no 'voxee-v' prefix)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version and tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="voxee-v${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#voxee-v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (app version ${TAG#voxee-v})"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # matches .nvmrc / CI (do not change major)

      - name: Install dependencies
        run: npm ci

      - name: Write brand .env from CI variables
        shell: bash
        run: |
          cat > .env <<'ENV'
          VITE_OXEE_EU_ENDPOINT=${{ vars.VITE_OXEE_EU_ENDPOINT }}
          VITE_OXEE_EU_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_EU_MODEL_TRANSCRIPTION }}
          VITE_OXEE_EU_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_EU_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_AGENT }}
          VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_EU_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_EU_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_US_ENDPOINT=${{ vars.VITE_OXEE_US_ENDPOINT }}
          VITE_OXEE_US_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_US_MODEL_TRANSCRIPTION }}
          VITE_OXEE_US_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_US_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_US_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_US_MODEL_DICTATION_AGENT }}
          VITE_OXEE_US_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_US_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_US_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_US_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_DEBUG=0
          ENV

      - name: Build branded Windows installer
        shell: bash
        env:
          BRAND_VERSION: ${{ needs.version.outputs.version }}
          BRAND_PUBLISH: never # release job uploads on the exact tag
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises API rate limit for helper downloads
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win:brand

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux renderer native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Install Linux build/packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Write brand .env from CI variables
        shell: bash
        run: |
          cat > .env <<'ENV'
          VITE_OXEE_EU_ENDPOINT=${{ vars.VITE_OXEE_EU_ENDPOINT }}
          VITE_OXEE_EU_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_EU_MODEL_TRANSCRIPTION }}
          VITE_OXEE_EU_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_EU_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_AGENT }}
          VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_EU_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_EU_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_US_ENDPOINT=${{ vars.VITE_OXEE_US_ENDPOINT }}
          VITE_OXEE_US_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_US_MODEL_TRANSCRIPTION }}
          VITE_OXEE_US_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_US_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_US_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_US_MODEL_DICTATION_AGENT }}
          VITE_OXEE_US_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_US_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_US_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_US_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_DEBUG=0
          ENV

      - name: Build branded Linux package (AppImage)
        shell: bash
        env:
          BRAND_VERSION: ${{ needs.version.outputs.version }}
          BRAND_PUBLISH: never
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux:brand

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  release:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # gh release context without a checkout
        run: |
          shopt -s nullglob
          assets=(artifacts/*/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No build artifacts downloaded" >&2
            exit 1
          fi
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"

          # Release notes = the annotated tag message, read via the API. The git
          # checkout doesn't reliably carry the tag object, so `git tag --contents`
          # falls back to the commit message — the API always has the annotation.
          NOTES=""
          OBJ=$(gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null || echo "")
          if [ "${OBJ%% *}" = "tag" ]; then
            NOTES=$(gh api "repos/${{ github.repository }}/git/tags/${OBJ##* }" --jq '.message')
          fi
          [ -z "$NOTES" ] && NOTES="VOxee $VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "${{ github.sha }}" \
              --title "VOxee $VERSION" \
              --notes "$NOTES"
          fi
          echo "Released $TAG with ${#assets[@]} asset(s)."
