name: Build (VOxee brand · test)

# Builds the branded, unsigned installers on every PR to main and uploads them
# as downloadable workflow artifacts — NO GitHub Release. This is the "test the
# exact build before you tag" step: download the artifact from the run, install
# and validate, then merge and tag `voxee-vX.Y.Z` to cut the real release.
#
# Same build config as release-brand.yml (branded, slimmed, self-hosted only).
# Endpoint/model config comes from repo Variables; API keys are never built in.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-brand-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push to the PR cancels the superseded build

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Write brand .env from CI variables
        shell: bash
        run: |
          cat > .env <<'ENV'
          VITE_OXEE_EU_ENDPOINT=${{ vars.VITE_OXEE_EU_ENDPOINT }}
          VITE_OXEE_EU_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_EU_MODEL_TRANSCRIPTION }}
          VITE_OXEE_EU_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_EU_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_AGENT }}
          VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_EU_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_EU_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_US_ENDPOINT=${{ vars.VITE_OXEE_US_ENDPOINT }}
          VITE_OXEE_US_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_US_MODEL_TRANSCRIPTION }}
          VITE_OXEE_US_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_US_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_US_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_US_MODEL_DICTATION_AGENT }}
          VITE_OXEE_US_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_US_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_US_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_US_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_DEBUG=0
          ENV

      - name: Build branded Windows installer
        shell: bash
        env:
          BRAND_VERSION: 0.0.0-pr${{ github.event.pull_request.number }}
          BRAND_PUBLISH: never
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win:brand

      - uses: actions/upload-artifact@v4
        with:
          name: VOxee-windows-pr${{ github.event.pull_request.number }}
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux renderer native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Install Linux build/packaging deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Write brand .env from CI variables
        shell: bash
        run: |
          cat > .env <<'ENV'
          VITE_OXEE_EU_ENDPOINT=${{ vars.VITE_OXEE_EU_ENDPOINT }}
          VITE_OXEE_EU_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_EU_MODEL_TRANSCRIPTION }}
          VITE_OXEE_EU_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_EU_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_AGENT }}
          VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_EU_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_EU_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_EU_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_EU_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_US_ENDPOINT=${{ vars.VITE_OXEE_US_ENDPOINT }}
          VITE_OXEE_US_MODEL_TRANSCRIPTION=${{ vars.VITE_OXEE_US_MODEL_TRANSCRIPTION }}
          VITE_OXEE_US_MODEL_DICTATION_CLEANUP=${{ vars.VITE_OXEE_US_MODEL_DICTATION_CLEANUP }}
          VITE_OXEE_US_MODEL_DICTATION_AGENT=${{ vars.VITE_OXEE_US_MODEL_DICTATION_AGENT }}
          VITE_OXEE_US_MODEL_DICTATION_TRANSLATION=${{ vars.VITE_OXEE_US_MODEL_DICTATION_TRANSLATION }}
          VITE_OXEE_US_MODEL_NOTE_FORMATTING=${{ vars.VITE_OXEE_US_MODEL_NOTE_FORMATTING }}
          VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE=${{ vars.VITE_OXEE_US_MODEL_CHAT_INTELLIGENCE }}
          VITE_OXEE_DEBUG=0
          ENV

      - name: Build branded Linux package (AppImage)
        shell: bash
        env:
          BRAND_VERSION: 0.0.0-pr${{ github.event.pull_request.number }}
          BRAND_PUBLISH: never
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:linux:brand

      - uses: actions/upload-artifact@v4
        with:
          name: VOxee-linux-pr${{ github.event.pull_request.number }}
          path: |
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
